        <div class="pb-4">
          <div class="flex justify-center space-x-8">
            <a class="tablink-plan-chart text-sm min-w-24 pb-1 border-b-4 border-slate-800 hover:text-slate-950 font-semibold text-center"
               data-tab="total"
               href="#">Gesamt</a>
            <a class="tablink-plan-chart text-sm min-w-24 pb-1 border-b-4 border-transparent text-slate-800 hover:text-slate-950 font-semibold text-center"
               data-tab="output"
               href="#">???</a>
          </div>
        </div>
        <div id="tab-content-plan-total" class="index-chart grow">
          {% include "partials/chart_info.html" %}
          <div id="myplan-chart" class="index-chart grow"></div>
          <div class="bg-blue-50 text-blue-700 text-sm text-center py-2 px-4 2xl:mt-4 border border-blue-200 rounded-md hidden">
            Die Ergebnisse sind nicht mehr aktuell. Bitte starten Sie die Berechnung neu.
          </div>
        </div>
        <div id="tab-content-plan-output" class="index-chart grow hidden">
          <div id="plan-chart-input-output" class="index-chart grow"></div>
          <!-- I added `index-chart grow`, remove if not needed -->
          New chart comes here
        </div>
      </div>
      <div class="relative pt-2 px-4 pb-2 2xl:py-4 2xl:px-8 w-1/2 rounded-r-lg shadow bg-white overflow-auto h-[28rem] 2xl:max-h-full 2xl:h-[34rem] overflow-x-hidden">

          <div class="bg-slate-100 py-1 px-2">
            <div class="flex items-center gap-x-8">
              <div class="flex items-center gap-x-2">
                <div id="production-slider-icon"></div>
                <div class="relative text-xs">Bestand</div>
              </div>
              <div class="flex items-center gap-x-2">
                <div id="demand-slider-icon"></div>
                <div class="relative text-xs">Prognose</div>
              </div>
            </div>
          </div>

                  onclick="startMyPlan('{{ my_plan_oemof_scenario }}');"

              <span class="sr-only">Loading...</span>
            </div>
            <span class="calculate-button-text">Neu berechnen</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
<div id="my_plan_results">
  {% include 'partials/results.html' with potentials=potentials_my_plan resultbox_id="resultbox_my_plan" %}
</div>
<script>
  // Tab functionality for my plan charts
  document.querySelectorAll('.tablink-plan-chart').forEach(tab => {
    tab.addEventListener('click', function(e) {
      e.preventDefault();

      document.querySelectorAll('.tablink-plan-chart').forEach(t => {
        t.classList.remove('border-slate-800', 'active-tab');
        t.classList.add('border-transparent');
      });

      document.querySelectorAll('[id^="tab-content-plan-"]').forEach(content => {
        content.classList.add('hidden');
      });

      this.classList.remove('border-transparent');
      this.classList.add('border-slate-800', 'active-tab');

      const selected = this.getAttribute('data-tab');
      const contentToShow = document.getElementById(`tab-content-plan-${selected}`);
      if (contentToShow) contentToShow.classList.remove('hidden');
    });
  });
</script>
