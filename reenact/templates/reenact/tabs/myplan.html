{% load l10n %}

<section>
  <div class="grid grid-cols-2 gap-6 pb-6">
    <div class="flex items-center p-4 bg-white shadow rounded-lg overflow-auto max-h-[20.75rem] 2xl:max-h-full 2xl:h-[30rem]">
      <div id="myplan-chart" class="index-chart"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="p-4 rounded-lg shadow bg-white overflow-auto max-h-[20.75rem] 2xl:max-h-full 2xl:h-[30rem]">
        <form id="capacityForm" onchange="update_chart('myplan-chart')">
          {{ capacities.as_div }}
        </form>
      </div>
      <div>
        <h2 class="text-base text-slate-800 font-bold mb-2">Hier können Sie einen eigenen Plan erstellen</h2>
        <p class="text-sm text-slate-500">Ausgehend vom Anlagenbestand 2024 und der Verbrauchsprognose...</p>
      </div>
    </div>
  </div>
</section>

<section class="grid grid-cols-2 gap-6">
  <div class="bg-white shadow rounded-lg p-4 pb-0 overflow-auto">
    <p class="flex items-center gap-2 text-sm text-slate-500 uppercase">
      Genutzte Energieerzeugungsflächen
      <!-- Tooltip Wrapper (group) -->
      <span class="relative group">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
             class="size-6 cursor-pointer">
          <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
        </svg>    
        <span class="absolute left-1/2 -translate-x-1/2 top-7 bg-slate-800 text-white text-xs normal-case px-3 py-1 rounded-lg shadow-md 
                      opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300 whitespace-nowrap z-50">
          Hier steht Info
        </span>
      </span>
    </p>    

    <div class="flex justify-center pt-2 gap-2 h-fit">
      {% for potential in potentials %}
        <c-potentials title="{{ potential.title }}" percentage="{{ potential.percentage }}" value="{{ potential.value }}" unit="{{ potential.unit }}" stroke_dashoffset="{{ potential.stroke_dashoffset }}" color="{{ potential.color }}">
        </c-potentials>
      {% endfor %}
    </div>
  </div>
  <div>
    <div class="flex flex-nowrap gap-4">
      {% for result in results %}
        <c-result_component_box title="{{ result.title }}" value1="{{ result.value1 }}" unit1="{{ result.unit1 }}" subtitle1="{{ result.subtitle1 }}" info_hover1="{{ result.info_hover1 }}" value2="{{ result.value2 }}" unit2="{{ result.unit2 }}" subtitle2="{{ result.subtitle2 }}" info_hover2="{{ result.info_hover2 }}" slider="{{ result.slider|unlocalize }}" />
      {% endfor %}
    </div>
  </div>
</section>
