<div class="grid grid-cols-2 gap-4 h-screen p-6">
  <div class="p-4 border rounded-lg shadow-md bg-white">
    <h2 class="text-lg font-bold mb-4">Wählen Sie ein Szenario aus</h2>
    <div id="scenarioTabs" class="flex flex-col gap-4">
      {{ scenarios|json_script:"scenarios-data" }}
      {% for scenario in scenarios %}
        <button class="scenario-button"
                onclick="updateScenario('{{ scenario.title }}', '{{ scenario.description }}', this); reload_main_chart('{{ scenario.number }}');">
          {{ scenario.number }}: {{ scenario.name }}
        </button>
      {% endfor %}
    </div>
  </div>
  <div id="scenario_box" class="p-4"></div>
</div>

  <template id="scenario_info">
    <h2 id="scenarioTitle" class="text-lg font-bold mb-2"></h2>
    <p id="scenarioDescription" class="text-gray-700 mb-4"></p>
  </template>
