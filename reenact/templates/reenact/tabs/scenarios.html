<div class="grid grid-cols-2 gap-4 h-screen p-6">
  <div class="p-4 border rounded-lg shadow-md bg-white">
    <h2 class="text-lg font-bold mb-4">Wählen Sie ein Szenario aus</h2>
    <div id="scenarioTabs" class="flex flex-col gap-4">
      {% for scenario in scenarios %}
        <button class="scenario-button {% if forloop.first %}selected{% endif %}"
                onclick="updateScenario('{{ scenario.title }}', '{{ scenario.description }}', this)">
          {{ scenario.number }}: {{ scenario.name }}
        </button>
      {% endfor %}
    </div>
  </div>
  <div class="p-4">
    <h2 id="scenarioTitle" class="text-lg font-bold mb-2">{{ scenarios.0.title }}</h2>
    <p id="scenarioDescription" class="text-gray-700 mb-4">{{ scenarios.0.description }}</p>
  </div>
</div>
