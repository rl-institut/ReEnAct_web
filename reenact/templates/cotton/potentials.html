<div class="center-container bg-white p-4">
  <div class="center-svg">
    <svg
     height="80"
     width="auto"
     viewBox="0 -2 60 59"
     version="1.1"
     xmlns="http://www.w3.org/2000/svg">
      <g id="layer1">
        <circle
           style="fill:#ffffff;stroke-width:3.535;stop-color:#000000;stroke:{{ color }};stroke-opacity:1;stroke-dasharray:169.65;stroke-dashoffset:{{ stroke_dashoffset }};fill-opacity:0"
           id="path13911"
           cx="50%"
           cy="50%"
           r="27"
          transform="rotate (-90 28.5 28.5)"/>
      </g>
    </svg>
  </div>
  <div class="percentage">{{ percentage }}%</div>
  <h2>{{ title }}</h2>
  <div>{{ value }} {{ unit }}</div>
</div>
