<div class="center-container bg-white p-4">
  <div class="center-ring">
    <svg
     height="60"
     width="60"
     viewBox="0 -2 60 59"
     version="1.1"
     xmlns="http://www.w3.org/2000/svg">
      <g id="layer1">
        <circle
          style="fill:none;stroke:#f1f5f9;stroke-width:3.535;stroke-dasharray:169.65;stroke-dashoffset:0"
          cx="50%"
          cy="50%"
          r="27"
          transform="rotate(-90 28.5 28.5)"
        />
        <circle
            style="fill:#ffffff;stroke-width:3.535;stop-color:#000000;stroke:{{ color }};stroke-opacity:1;stroke-dasharray:169.65;stroke-dashoffset:{{ stroke_dashoffset }};fill-opacity:0"
            id="path13911"
            cx="50%"
            cy="50%"
            r="27"
            transform="rotate (-90 28.5 28.5)"
        />
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#1E293B" font-size="13px" font-weight="bold">
            {{ percentage }}%
        </text>
      </g>
    </svg>
  </div>
  <h3 class="relative text-sm text-slate-500 overflow-hidden whitespace-nowrap">{{ title }}</h3>
  <div class="relative text-sm font-bold text-slate-800 overflow-hidden whitespace-nowrap">{{ value }} {{ unit }}</div>
</div>
