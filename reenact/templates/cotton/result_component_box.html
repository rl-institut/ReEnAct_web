<div id="component_box"
     class="flex flex-col justify-between bg-white shadow rounded-lg p-4 pb-2 min-w-[10rem] w-full md:w-[20rem] 2xl:flex-1 max-w-[49%]">
  <div>
    <h3 class="text-sm text-slate-500 font-normal text-left">{{ title }}</h3>
    {% if "status_quo_2" in id %}
      <span class="flex items-center justify-center h-full text-4xl">-</span>
    {% else %}
      <div class="flex justify-center pb-2 {% if not value3 %}flex-col{% else %}flex-row{% endif %}">
        <div class="grow basis-0 pt-1 px-2 {% if value3 %}border-e{% endif %}">
          <span class="text-2xl font-bold">{{ value1 }}</span>
          <span class="text-base font-bold">{{ unit1 }}</span>
          <p class="flex items-center justify-center gap-2 text-sm text-slate-500">
            {{ subtitle1 }}
            <span class="relative group">
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   class="size-6 cursor-pointer">
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
              </svg>
              <span class="absolute left-1/2 -translate-x-1/2 top-7 bg-slate-800 text-white text-xs normal-case px-3 py-1 rounded-lg shadow-md opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300 whitespace-nowrap z-50">
                {{ info_hover1 }}
              </span>
            </span>
          </p>
        </div>
        <div class="grow basis-0 pt-1 px-2">
          <span class="text-2xl font-bold">{{ value2 }}</span>
          <span class="text-base font-bold">{{ unit2 }}</span>
          <p class="flex items-center justify-center gap-2 text-sm text-slate-500">
            {{ subtitle2 }}
            <span class="relative group">
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   class="size-6 cursor-pointer">
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
              </svg>
              <span class="absolute left-1/2 -translate-x-1/2 top-7 bg-slate-800 text-white text-xs normal-case px-3 py-1 rounded-lg shadow-md opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300 whitespace-nowrap z-50">
                {{ info_hover2 }}
              </span>
            </span>
          </p>
        </div>
      </div>
      {% if value3 %}
        <div class="pt-1">
          <span class="text-2xl font-bold">{{ value3 }}</span>
          <span class="text-base font-bold">{{ unit3 }}</span>
          <p class="flex items-center justify-center gap-2 text-sm text-slate-500">
            {{ subtitle3 }}
            <span class="relative group">
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   class="size-6 cursor-pointer">
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
              </svg>
              <span class="absolute left-1/2 -translate-x-1/2 top-7 bg-slate-800 text-white text-xs normal-case px-3 py-1 rounded-lg shadow-md opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300 whitespace-nowrap z-50">
                {{ info_hover3 }}
              </span>
            </span>
          </p>
        </div>
      {% endif %}
    </div>
  {% endif %}
</div>
