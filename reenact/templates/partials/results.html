{% load l10n %}

<section class="grid grid-cols-2 gap-6">
  <div class="bg-white shadow rounded-lg p-4 pb-0 overflow-auto">
    <p class="flex items-center gap-2 text-sm text-slate-500 uppercase">
      Genutzte Energieerzeugungsflächen
      <!-- Tooltip Wrapper (group) -->
      <span class="relative group">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.5"
             stroke="currentColor"
             class="size-6 cursor-pointer">
          <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
        </svg>
        <span class="absolute left-1/2 -translate-x-1/2 top-7 bg-slate-800 text-white text-xs normal-case px-3 py-1 rounded shadow-md opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300 whitespace-nowrap z-50">
          Hier steht Info
        </span>
      </span>
    </p>
    <div class="potentials flex pt-2 gap-2 h-fit">{% include 'partials/potentials.html' %}</div>
  </div>
  <div>
    <div class="flex flex-nowrap gap-4">
      {% for result in results %}
        <c-result_component_box id="{{ resultbox_id | default_if_none:"resultbox" }}_{{ forloop.counter }}" title="{{ result.title }}" value1="{{ result.value1 }}" unit1="{{ result.unit1 }}" subtitle1="{{ result.subtitle1 }}" info_hover1="{{ result.info_hover1 }}" value2="{{ result.value2 }}" unit2="{{ result.unit2 }}" subtitle2="{{ result.subtitle2 }}" info_hover2="{{ result.info_hover2 }}" slider="{{ result.slider|unlocalize }}" />
      {% endfor %}
    </div>
  </div>
</section>
